<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hitung Tombol</title>
</head>
<body>
    <h1>Hitung Tombol - T4_059</h1>
    <button onclick="tomboll()">Klik tombol ini!</button>
    <p>Jumlah klik: <span id="jumlahKlik">0</span></p>

    <script>
        let jumlahKlik = 0;
        function tomboll() {
            jumlahKlik++;
            document.getElementById("jumlahKlik").textContent = jumlahKlik;
        }
    </script>
</body>
</html>
