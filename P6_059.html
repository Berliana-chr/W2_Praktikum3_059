<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daftar Tugas</title>
    <style>
      .completed {
        text-decoration: line-through;
        color: gray;
      }
      button {
        margin-left: 10px;
      }
    </style>
  </head>
  <body>
    <h1>Daftar Tugas - P6_059</h1>

    <!-- Form untuk menambah tugas -->
    <input type="text" id="inputTugas" placeholder="Masukkan tugas" />
    <button onclick="tambahTugas()">Tambah Tugas</button>

    <!-- Tombol untuk menampilkan daftar tugas -->
    <button onclick="tampilkanTugas()">Tampilkan Daftar Tugas</button>

    <!-- Daftar Tugas -->
    <ul id="listTugas" style="display: none"></ul>

    <script>
      // Deklarasi array untuk menyimpan daftar tugas
      let daftarTugas = [];

      // Fungsi untuk menambah tugas
      function tambahTugas() {
        const input = document.getElementById("inputTugas");
        const tugas = input.value.trim(); // Menghapus spasi berlebih di awal/akhir input

        if (tugas) {
          // Memastikan input tidak kosong
          daftarTugas.push({ text: tugas, completed: false }); // Menambahkan tugas ke dalam array
          console.log(`Tugas "${tugas}" berhasil ditambahkan.`);
          input.value = ""; // Membersihkan input setelah menambah tugas
          alert(`Tugas "${tugas}" berhasil ditambahkan.`); // Menampilkan notifikasi berhasil
        } else {
          alert("Masukkan tugas yang valid."); // Peringatan jika input kosong
        }
      }

      // Fungsi untuk menandai tugas selesai atau belum selesai
      function tandaSelesai(indeks) {
        daftarTugas[indeks].completed = !daftarTugas[indeks].completed;
        tampilkanTugas();
      }

      // Fungsi untuk menampilkan daftar tugas
      function tampilkanTugas() {
        const list = document.getElementById("listTugas");
        list.innerHTML = ""; // Membersihkan daftar sebelum ditampilkan

        if (daftarTugas.length === 0) {
          list.innerHTML = "<li>Tidak ada tugas.</li>";
        } else {
          daftarTugas.forEach((tugas, index) => {
            const li = document.createElement("li");
            const checkbox = document.createElement("input");
            checkbox.type = "checkbox";
            checkbox.checked = tugas.completed;
            checkbox.onchange = () => tandaSelesai(index);

            const span = document.createElement("span");
            span.textContent = tugas.text;
            if (tugas.completed) {
              span.classList.add("completed");
            }

            const btnHapus = document.createElement('button');
            btnHapus.textContent = "Hapus";
            btnHapus.style.marginLeft = "10px";
            btnHapus.onclick = () => hapusTugas(index);
            
            li.appendChild(checkbox);
            li.appendChild(span);
            li.appendChild(btnHapus);
            
            list.appendChild(li);
          });
        }

        // Tampilkan daftar hanya saat tombol ditekan
        list.style.display = "block";
      }

      // Fungsi untuk menghapus tugas berdasarkan indeks
      function hapusTugas(indeks) {
        if (indeks >= 0 && indeks < daftarTugas.length) {
          const [tugasTerhapus] = daftarTugas.splice(indeks, 1);
          console.log(`Tugas "${tugasTerhapus.text}" berhasil dihapus.`);
          alert(`Tugas "${tugasTerhapus.text}" berhasil dihapus.`);
          tampilkanTugas(); // Memperbarui tampilan setelah penghapusan
        } else {
          alert("Indeks tugas tidak valid.");
        }
      }
    </script>
  </body>
</html>
